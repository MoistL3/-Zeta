<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zeta - Dashboard</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 10px; width: 360px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .badge { display: inline-block; background: #334155; padding: 4px 12px; border-radius: 999px; font-size: 0.85rem; margin: 8px 0; color: #38bdf8; }
        button { margin-top: 20px; padding: 10px 20px; border: none; border-radius: 6px; background: #ef4444; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #dc2626; }
    </style>
</head>
<body>
<div class="card">
    <h2>Hello, <span id="user-name">...</span></h2>
    <p id="user-email"></p>
    <div class="badge" id="user-role"></div>
    <br />
    <button id="logout-btn">Logout</button>
</div>

<script src="./JS/index.js"></script>
</body>
</html>
